# ============================================================
# 始祖鸟德国站监控 · 配置
# 改完提交到仓库即可生效（下一次定时运行就会用新配置）
# ============================================================

country: de            # 德国站
language: en           # 商品名用英文（改成 de 就是德语名）
sites: [main, outlet]  # main = 正价站 arcteryx.com，outlet = 奥莱 outlet.arcteryx.com

# 每次扫描的大类（默认就是全站：男、女、配件、背包、鞋）
categories: [mens, womens, accessories, packs, footwear]

# 每次运行最多抓多少个商品详情页来看尺码库存。
# 关注规则匹配到的商品超过这个数时会分批轮流检查，数字越大越及时，但请求越多、越容易被拦。
max_detail_pages: 40

subscribers:
  # ---------------- 第一个人（你自己） ----------------
  - name: 我
    bark: BARK_ME          # GitHub Secret 的名字
    admin: true            # 接收系统消息（抓取失败、被拦截、恢复）
    daily_digest: true     # 每晚 20:07 发当天汇总

    # 全站动态：只看男款，重点是奥莱
    feed:
      new_products: [outlet]          # 奥莱上新
      back_in_catalog: [outlet]       # 奥莱售罄后重新上架
      price_drops: [outlet, main]     # 降价（正价站开始打折 / 奥莱再降价）
      gender: mens                    # 只推男款（配件、背包这类不分男女的照推）

    # 关注清单：暂时不盯具体款式。想盯某一款时加在这里
    watch: []

  # ---------------- 朋友：去掉下面每行开头的 "# " 启用，并添加同名 Secret ----------------
  # - name: 朋友A
  #   bark: BARK_FRIEND_A
  #   daily_digest: false
  #   feed:
  #     new_products: [outlet]
  #     price_drops: [outlet]
  #     gender: womens
  #   watch:
  #     - name: 奥莱 Atom 女款 S 码
  #       site: outlet
  #       keywords: [atom]
  #       gender: womens
  #       sizes: [S]

# ---------------- 规则字段说明 ----------------
# site:         outlet / main / 不写=两个站都看
# url:          具体商品链接（写了就只看这一个商品）
# keywords:     名字里必须同时包含的词
# exclude:      名字里不能包含的词，比如 [pant, short]
# gender:       mens / womens
# sizes:        尺码，写法和官网一致：XS S M L XL / 鞋码 42 2/3 / 裤子 32 或 32-R
# colours:      颜色，写官网上的颜色名；双色款写其中一个也行：Black 匹配 "Black"、"Black / Mongoose"，不匹配 "Black Sapphire"
# max_price:    价格上限（欧元，按折后价）
# min_discount: 最低折扣百分比，30 表示至少便宜 30%
